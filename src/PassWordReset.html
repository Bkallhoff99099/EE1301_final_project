<!DOCTYPE html>

<html></html>

<head>
    <title>
    SMART Safe Password Reset
</title>
    <link rel="stylesheet" href="styles.css"/>
</head>

<body>

    <h1>Reset Password</h1>

    <button class="pageNavigation"
        onclick="window.location.href='MainWebPage.html'">
        Back
    </button>

    <br><br>

    <button class="pageNavigation" onclick="input(4)">
        Start Password Reset
    </button>

    <p class="centered_text">
        Enter your old password, then your new password.
    </p>

    <div class="main_buttons_div">

        <button class="redButton" onclick="input(0)">Red</button>
        <button class="blueButton" onclick="input(1)">Blue</button>
        <button class="greenButton" onclick="input(2)">Green</button>

    </div>

    <script>

        const deviceID = "0a10aced202194944a06a5c4";
        const accessToken = "YOUR_ACCESS_TOKEN";

        // Sends button input to the Photon
        function input(value) {

            fetch("https://api.particle.io/v1/devices/" 
                + deviceID + "/cloud_input", {

                method: "POST",

                headers: {
                    "Authorization": "Bearer " + accessToken,
                    "Content-Type": "application/x-www-form-urlencoded"
                },

                body: "arg=" + value
            });
        }

    </script>

</body>

</html>
