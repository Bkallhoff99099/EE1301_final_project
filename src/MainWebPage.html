<!DOCTYPE html> 

<html>


<head>
    <title>
   SMART Safe
</title>

    <link rel="stylesheet" href="styles.css"/>
</head>
<body>
<h1>SMART Safe</h1>

<p id="safeStatus">Ready for input</p>

<p id="status">Ready for input</p>


<br>

<div class="main_buttons_div">
    <form>
    <button class="redButton" id="red" 
    onclick="input(0)">Red</button> 
    <button class="blueButton" id="blue" 
    onclick="input(1)">Blue</button>
    <button class="greenButton" id="green" 
    onclick="input(2)">Green</button> <br>
    
</div>

<br>

<button class="yellowButton"
        onclick="input(3)">Lock Safe</button>

<br><br>

<button class=""pageNavigation"
onclick="window.location.href='PassWordReset.html'">Reset Password</button>"
<script>

// Particle device information
        const deviceID = "0a10aced202194944a06a5c4";
        const accessToken = "YOUR_ACCESS_TOKEN";
        const baseURL = "https://api.particle.io/v1/devices/";

        async function input(value) {


    document.getElementById("status").innerText = "Sending last command.....";

try {
    const response = await fetch(baseURL + deviceID + "/cloud_input", {
        method: "POST",
headers: {
                        "Authorization": "Bearer " + accessToken,
                        "Content-Type": "application/x-www-form-urlencoded"
                    },

                    body: "arg=" + value
                });

                if (!response.ok) {
                    throw new Error("Command failed");
                }

                document.getElementById("status").innerText =
                    "Command sent successfully";

            } catch (error) {

                document.getElementById("status").innerText =
                    "Unable to send command";
            }
        }
        var functionName = "cloud_input"; // local variable functionName
 // Gets the current state of the safe
        async function updateStatus() {

            try {

                const response = await fetch(
                    baseURL + deviceID + "/safeStatus", {

                    headers: {
                        "Authorization": "Bearer " + accessToken
                    }
                });

                if (!response.ok) {
                    throw new Error("Status unavailable");
                }

                // Reads the information returned by Particle
                const data = await response.json();

                // Possible states of the safe
                const states = [
                    "Safe Locked",
                    "Safe Unlocked",
                    "Alarm Triggered",
                    "Resetting Password"
                ];

                // Displays the current state
                document.getElementById("safeStatus").innerText =
                    states[data.result] || "Unknown State";

            } catch (error) {

                document.getElementById("safeStatus").innerText =
                    "Safe Disconnected";
            }
        }

        // Checks the safe immediately
        updateStatus();

        // Checks the safe every two seconds
        setInterval(updateStatus, 2000);

    </script>

</body>

</html>
